name: Standard CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.json"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          json_files = sorted(pathlib.Path(".").rglob("*.json"))
          if not json_files:
              print("No JSON files found.")
              sys.exit(0)

          failed = []
          for path in json_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK: {path}")
              except Exception as exc:
                  failed.append((path, exc))

          if failed:
              for path, exc in failed:
                  print(f"FAIL: {path}: {exc}")
              sys.exit(1)
          PY

      - name: Validate contract metadata keys
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          contract_file = Path("contracts.json")
          required_keys = {"name", "label", "module", "version", "description", "fields"}

          if not contract_file.exists():
              print("contracts.json not found.")
              sys.exit(1)

          data = json.loads(contract_file.read_text(encoding="utf-8"))
          missing = sorted(required_keys - set(data.keys()))

          if missing:
              print(f"Missing required keys in contracts.json: {', '.join(missing)}")
              sys.exit(1)

          print("contracts.json required keys are present.")
          PY
